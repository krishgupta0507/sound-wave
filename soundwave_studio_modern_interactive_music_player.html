<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWave Studio — Modern Music Player</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#06b6d4',
                            600: '#0284c7',
                            Accent: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Vinyl rotation animation */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-vinyl {
            animation: spinSlow 18s linear infinite;
        }
        .paused-vinyl {
            animation-play-state: paused;
        }

        /* Ambient Glow animation */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            pointer-events: none;
            transition: all 1s ease;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 overflow-x-hidden relative">

                    <div class="flex items-center space-x-3">

                        </div>
                    </div>

                    <!-- Keyboard info & File Upload -->
                    <div class="flex items-center space-x-2">
                        <label for="audioFileInput" class="cursor-pointer px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700/80 text-xs text-cyan-400 border border-slate-700/60 transition-all flex items-center space-x-1.5 shadow-sm" title="Add Local Audio Tracks">

                            <span class="hidden sm:inline font-medium">Add Track</span>
                        </label>
                        <input type="file" id="audioFileInput" accept="audio/*" multiple class="hidden">
                        
                        <button id="keyboardHintBtn" class="p-2 rounded-xl bg-slate-800/60 hover:bg-slate-700 text-slate-400 transition-colors text-xs" title="Keyboard Shortcuts">

                </div>

                    <!-- Cover Container -->

                        <!-- Vinyl/Cover Image -->
                        <div class="w-full h-full rounded-xl overflow-hidden relative shadow-inner">
                            <img id="albumArt" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80" alt="Album Cover" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-60"></div>
                        </div>

                        <!-- Dynamic Animated Ring Badge -->

                            <span id="badgeState" class="text-[10px] font-mono text-slate-400 uppercase tracking-wider">Stopped</span>
                        </div>
                    </div>

                    <!-- Audio Visualizer Canvas -->
                    <div class="w-full h-16 relative flex items-end justify-center mb-2 px-4">
                        <canvas id="visualizerCanvas" class="w-full h-full rounded-lg"></canvas>
                    </div>

                    <!-- Track Details Banner -->
                    <div class="text-center w-full px-4">
                        <div class="flex items-center justify-center space-x-2">
                            <h2 id="songTitle" class="text-xl sm:text-2xl font-bold text-white truncate max-w-[280px] sm:max-w-[360px]">Neon Sunrise</h2>
                            <button id="likeBtn" class="text-slate-500 hover:text-rose-500 transition-colors text-lg" title="Favorite">
                                <i class="fa-regular fa-heart"></i>
                            </button>
                        </div>
                        <p id="artistName" class="text-slate-400 text-sm font-medium mt-0.5 truncate">CyberSynth Labs</p>
                    </div>
                </div>

                <!-- BOTTOM CONTROLS SECTION -->

                    <!-- Progress Bar & Tooltip -->
                    <div class="space-y-1 relative">

                        <div id="hoverTimeTooltip" class="absolute -top-7 transform -translate-x-1/2 bg-slate-800 text-cyan-400 text-[10px] font-mono px-1.5 py-0.5 rounded shadow border border-slate-700 hidden">

                            </div>

                </div>
            </div>
        </div>

    <script>
        /* ==========================================================================
           SoundWave Studio — Application Logic
           ========================================================================== */

        // Synthetic Audio Generator for high-quality fallback demo sounds
        function generateSyntheticAudio(freq1, freq2, type = 'synth') {
            const sampleRate = 44100;
            const duration = 12; // 12 seconds loopable stream
            const numSamples = sampleRate * duration;
            const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
            const buffer = ctx.createBuffer(2, numSamples, sampleRate);

            for (let channel = 0; channel < 2; channel++) {
                const nowBuff = buffer.getChannelData(channel);
                for (let i = 0; i < numSamples; i++) {
                    const t = i / sampleRate;
                    // Harmonious ambient chords with soft beat pulse
                    const wave1 = Math.sin(2 * Math.PI * freq1 * t);
                    const wave2 = Math.sin(2 * Math.PI * freq2 * t + (channel * 0.1));
                    const beatPulse = Math.sin(2 * Math.PI * 1.5 * t) * 0.3 + 0.7;
                    nowBuff[i] = (wave1 * 0.4 + wave2 * 0.3) * beatPulse * 0.25;
                }
            }

            // Convert AudioBuffer to WAV Data URI
            return bufferToWaveUrl(buffer, numSamples, sampleRate);
        }

        function bufferToWaveUrl(abuffer, len, sampleRate) {
            const numOfChan = abuffer.numberOfChannels;
            const length = len * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            const channels = [];
            let sample = 0;
            let offset = 0;
            let pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt "
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
